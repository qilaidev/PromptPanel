services:
  promptpanel-sync:
    build: .
    container_name: promptpanel-sync
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      - "${PP_SYNC_PORT:-18787}:18787"
    environment:
      PP_SYNC_HOST: "0.0.0.0"
      PP_SYNC_PORT: "18787"
      PP_SYNC_DATA_DIR: "/var/lib/promptpanel-sync"
      PP_SYNC_ALLOWED_TOKENS: "${PP_SYNC_ALLOWED_TOKENS:-}"
    volumes:
      - ./data:/var/lib/promptpanel-sync
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request, sys; port = os.environ.get('PP_SYNC_PORT', '18787'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    security_opt:
      - no-new-privileges:true
